name: Generate Snake Animation

# Regenerates the animated contribution "snake" SVGs and pushes them to the
# `output` branch, which is what the profile README's <img>/<picture> tags
# point to (raw.githubusercontent.com/.../output/...). Without this workflow
# those images are just broken links — nothing in this repo generates them
# on its own.
on:
  schedule:
    - cron: "0 0 * * *" # once a day, at midnight UTC
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate the snake animation SVGs (light + dark)
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push generated files to the "output" branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
